---
- name: Set up iptables firewall
  include_tasks:
    file: iptables.yml
    apply:
      tags:
        - firewall-reload
  when: firewall_backend == 'iptables'
  tags:
    - firewall-reload

- name: Set up nftables firewall
  include_tasks:
    file: nftables.yml
    apply:
      tags:
        - firewall-reload
  when: firewall_backend == 'nftables'
  tags:
    - firewall-reload

- name: Verify nftables firewall
  include_tasks:
    file: nftables_verify.yml
    apply:
      tags:
        - firewall-reload
        - firewall-verify
  when: firewall_backend == 'nftables' and not ansible_check_mode
  tags:
    - firewall-reload
    - firewall-verify
